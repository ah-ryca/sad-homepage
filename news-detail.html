<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جزئیات خبر - سامانه ساد</title>
    
    <link rel="stylesheet" href="assets/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="assets/css/lineicons.css">
    <link rel="stylesheet" href="assets/css/ud-styles.css">
    <link rel="stylesheet" href="style.css?v=2.0.3">
</head>

<body class="dark-theme">
    <div class="ambient-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <!-- Header & Navigation -->
    <header style="background: var(--card-bg); backdrop-filter: var(--glass-blur);">
        <div class="container nav-wrapper">
            <div class="logo-section">
                <a href="index.html" style="display:flex; align-items:center; text-decoration: none; color: inherit;">
                    <img src="images/logo.png" alt="لوگو سامانه ساد" class="site-logo">
                    <div class="logo-title">ساد</div>
                </a>
            </div>
            <div class="nav-menu-wrapper">
                <nav>
                    <ul class="nav-menu">
                        <li><a href="index.html#hero">بازگشت به صفحه اصلی</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>

    <section class="pt-120 pb-120" style="min-height: 100vh;">
        <div class="container">
            <div id="loading-container" class="text-center" style="margin-top: 100px;">
                <p>در حال بارگذاری جزئیات خبر...</p>
            </div>
            <div id="detail-container" style="display: none;">
                <div class="insta-detail-layout">
                    <!-- Image Side -->
                    <div class="insta-detail-image-side">
                        <img id="news-image" src="" alt="News Image">
                    </div>
                    
                    <!-- Content Side -->
                    <div class="insta-detail-content-side">
                        <!-- Header -->
                        <div class="insta-header">
                            <img src="images/logo.png" alt="SAD Logo" class="insta-avatar">
                            <div class="insta-header-text">
                                <h4 class="insta-author">سامانه ساد</h4>
                                <p class="insta-date" id="news-date">در حال دریافت تاریخ...</p>
                            </div>
                        </div>
                        
                        <!-- Body (Scrollable) -->
                        <div class="insta-detail-body">
                            <h2 id="news-title">عنوان خبر</h2>
                            <p id="news-content">محتوای خبر...</p>
                        </div>
                        
                        <!-- Footer -->
                        <div class="insta-footer" style="border-top: 1px solid var(--border);">
                            <div class="insta-actions">
                                <div class="insta-icons">
                                    <i class="lni lni-heart insta-icon"></i>
                                    <i class="lni lni-bubble insta-icon"></i>
                                    <i class="lni lni-telegram-original insta-icon"></i>
                                </div>
                                <div class="insta-views">
                                    <i class="lni lni-eye"></i> <span id="news-views">0</span> بازدید
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="assets/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const urlParams = new URLSearchParams(window.location.search);
            const newsId = urlParams.get('id');

            if (!newsId) {
                document.getElementById('loading-container').innerHTML = '<p>خطا: شناسه خبر نامعتبر است.</p>';
                return;
            }

            fetch(`http://127.0.0.1:8000/api/public/news/${newsId}/`)
                .then(response => {
                    if (!response.ok) throw new Error('News not found');
                    return response.json();
                })
                .then(news => {
                    document.getElementById('loading-container').style.display = 'none';
                    document.getElementById('detail-container').style.display = 'block';

                    const date = new Date(news.created_at).toLocaleDateString('fa-IR');
                    document.getElementById('news-date').innerText = date;
                    document.getElementById('news-title').innerText = news.title;
                    document.getElementById('news-content').innerText = news.content;
                    document.getElementById('news-views').innerText = news.views_count;
                    
                    const imageUrl = news.image_url ? news.image_url : 'assets/images/blog/blog-01.jpg';
                    document.getElementById('news-image').src = imageUrl;
                    document.title = news.title + ' - سامانه ساد';
                })
                .catch(error => {
                    console.error('Error fetching news details:', error);
                    document.getElementById('loading-container').innerHTML = '<p>خطا در دریافت جزئیات خبر. ممکن است این خبر حذف شده باشد.</p>';
                });
        });
    </script>
</body>
</html>
